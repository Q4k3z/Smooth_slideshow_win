name: Feature Request
description: Suggest an idea or enhancement for Smooth Slideshow
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature for Smooth Slideshow!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe how you envision this feature working.
    validations:
      required: true
