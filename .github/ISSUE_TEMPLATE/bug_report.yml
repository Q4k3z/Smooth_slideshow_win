name: Bug Report
description: Create a report to help us improve Smooth Slideshow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this behavior?
      placeholder: |
        1. Open Smooth Slideshow
        2. Select a folder with ...
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows & Display Environment
      description: OS version and display resolution / scaling (e.g. Windows 11 23H2, 1920x1080 125%)
    validations:
      required: false
